<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Terputus - Kios Desktop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #090d16;
            color: #f1f5f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .error-card {
            background: #111827;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="text-warning mb-3">
            <i class="bi bi-wifi-off display-2"></i>
        </div>
        <h4 class="fw-bold mb-2 text-white">Tidak Dapat Terhubung ke Server</h4>
        <p class="text-secondary small mb-4">
            Aplikasi Desktop tidak dapat menghubungi server Kios di <code>http://172.16.5.11/</code>. Pastikan Raspberry Pi sudah menyala dan terhubung ke jaringan Wi-Fi / LAN yang sama.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <button onclick="location.href='http://172.16.5.11/'" class="btn btn-primary rounded-pill px-4 fw-bold">
                <i class="bi bi-arrow-clockwise me-1"></i> Hubungkan Ulang
            </button>
            <button onclick="window.close()" class="btn btn-outline-secondary rounded-pill px-3">
                Tutup Aplikasi
            </button>
        </div>
    </div>
</body>
</html>
